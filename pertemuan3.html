<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar CSS</title>
    <link rel="stylesheet" href="style.css">
    <!-- embedded stylesheet -->
    <style>
        h2 {
            color: green;
        }
    </style>
</head>

<body>
    <!-- inline stylesheet -->
    <h1 style="color: red;">ini adalah h1</h1>
    <h2>ini adalah h2</h2>
    <h3>ini adalah h3</h3>

    <!-- class selector -->
    <p class="p1">paragraf 1</p>

    <!-- id selector -->
    <p id="p2">paragraf 2</p>

    <!-- pseudo selector -->
    <a href="#">ini link</a>

    <!-- css background -->
    <div class="k1"></div>

    <!-- css background -->
    <div class="k1"></div>

    <!-- margin and padding -->

    <!-- css animation -->

    <br><br>

    <!-- grid dan flexbox -->

    </div>
</body>

</html>
